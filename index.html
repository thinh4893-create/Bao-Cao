<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Báo Cáo F4 AUTO</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
    
    /* Tabs Navigation */
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e9ecef; cursor: pointer; font-weight: bold; border-radius: 8px 8px 0 0; transition: 0.3s; }
    .tab-btn.active { background: #1a73e8; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form Styles */
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="date"], select, input[type="number"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* Table Styles */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 10px; }
    .btn-delete { background-color: #d9534f; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-delete:hover { background-color: #c9302c; }
    .btn-submit { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-submit:hover { background-color: #218838; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #f8f9fa; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .ktv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 5px; }
    .ktv-item { background: #f1f3f4; padding: 10px; border-radius: 6px; }
    .ktv-item label { margin-bottom: 5px; display: block; color: #1a73e8; }
  </style>
</head>
<body>

<div class="container">
  <h2>HỆ THỐNG QUẢN LÝ BÁO CÁO F4 AUTO</h2>

  <!-- Thanh chọn Tab -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('8h')">📋 Báo Cáo 8H (Chấm Công)</button>
    <button class="tab-btn" onclick="switchTab('17h')">⏰ Báo Cáo 17H (Tăng Ca)</button>
  </div>

  <!-- TAB 1: BÁO CÁO 8H -->
  <div id="tab-8h" class="tab-content active">
    <form id="form8h" onsubmit="submitForm(event, '8h')">
      <div class="form-group">
        <label>Ngày báo cáo:</label>
        <input type="date" id="date8h" required>
      </div>
      
      <div class="form-group">
        <label>Trạng thái KTV:</label>
        <div class="ktv-grid">
          <div class="ktv-item"><label>Vũ</label><select id="ktv_Vu"><option>Đi làm</option><option>Nghỉ</option><option>Nghỉ sáng</option><option>Nghỉ chiều</option></select></div>
          <div class="ktv-item"><label>Hậu</label><select id="ktv_Hau"><option>Đi làm</option><option>Nghỉ</option><option>Nghỉ sáng</option><option>Nghỉ chiều</option></select></div>
          <div class="ktv-item"><label>Hoàng</label><select id="ktv_Hoang"><option>Đi làm</option><option>Nghỉ</option><option>Nghỉ sáng</option><option>Nghỉ chiều</option></select></div>
          <div class="ktv-item"><label>Tùng</label><select id="ktv_Tung"><option>Đi làm</option><option>Nghỉ</option><option>Nghỉ sáng</option><option>Nghỉ chiều</option></select></div>
          <div class="ktv-item"><label>Thịnh</label><select id="ktv_Thinh"><option>Đi làm</option><option>Nghỉ</option><option>Nghỉ sáng</option><option>Nghỉ chiều</option></select></div>
        </div>
      </div>
      
      <button type="submit" class="btn-submit">Gửi Báo Cáo 8H</button>
    </form>
  </div>

  <!-- TAB 2: BÁO CÁO 17H -->
  <div id="tab-17h" class="tab-content">
    <form id="form17h" onsubmit="submitForm(event, '17h')">
      <div class="form-group">
        <label>Ngày tăng ca:</label>
        <input type="date" id="date17h" required>
      </div>
      
      <div class="form-group">
        <label>Chọn KTV Tăng Ca:</label>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
          <label><input type="checkbox" name="ktv17" value="Vũ"> Vũ</label>
          <label><input type="checkbox" name="ktv17" value="Hậu"> Hậu</label>
          <label><input type="checkbox" name="ktv17" value="Hoàng"> Hoàng</label>
          <label><input type="checkbox" name="ktv17" value="Tùng"> Tùng</label>
          <label><input type="checkbox" name="ktv17" value="Thịnh"> Thịnh</label>
        </div>
      </div>

      <div class="form-group">
        <label>Số giờ tăng ca:</label>
        <input type="number" id="hours17h" step="0.5" placeholder="Ví dụ: 1.5, 2..." required>
      </div>

      <div class="form-group">
        <label>Khung giờ tăng ca:</label>
        <input type="text" id="thoiGian17h" placeholder="Ví dụ: 17h30 - 19h00">
      </div>

      <button type="submit" class="btn-submit">Gửi Báo Cáo Tăng Ca</button>
    </form>
  </div>

  <!-- MỤC LỊCH SỬ DÙNG CHUNG -->
  <div class="history-header">
    <h3 style="margin: 0; color: #333;">📜 Lịch Sử Báo Cáo</h3>
    <button class="btn-delete" onclick="deleteSelectedHistory()">🗑️ Xóa mục đã chọn</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 40px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
        <th>Ngày</th>
        <th>Vũ</th>
        <th>Hậu</th>
        <th>Hoàng</th>
        <th>Tùng</th>
        <th>Thịnh</th>
      </tr>
    </thead>
    <tbody id="historyTableBody">
      <tr><td colspan="7">Đang tải lịch sử...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ⚠️ THAY CẤU HÌNH WEB APP URL CỦA BẠN VÀO ĐÂY
  const WEB_APP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; 

  let currentTab = '8h';

  // Tự động đặt ngày hôm nay
  document.getElementById('date8h').valueAsDate = new Date();
  document.getElementById('date17h').valueAsDate = new Date();

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tab === '8h') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-8h').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-17h').classList.add('active');
    }
  }

  // Chức năng tích/bỏ tích chọn tất cả
  function toggleSelectAll(master) {
    const checkboxes = document.querySelectorAll(".row-checkbox");
    checkboxes.forEach(cb => cb.checked = master.checked);
  }

  // Hàm hiển thị Lịch sử
  function renderHistory(dataList) {
    const tbody = document.getElementById("historyTableBody");
    tbody.innerHTML = "";

    if (!dataList || dataList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7">Không có lịch sử</td></tr>';
      return;
    }

    dataList.forEach(item => {
      // Bỏ qua dòng Tổng
      if (item.date && item.date.toString().includes("TỔNG")) return;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="checkbox" class="row-checkbox" value="${item.date}"></td>
        <td>${item.date || ''}</td>
        <td>${item.Vu || item['Vũ'] || '-'}</td>
        <td>${item.Hau || item['Hậu'] || '-'}</td>
        <td>${item.Hoang || item['Hoàng'] || '-'}</td>
        <td>${item.Tung || item['Tùng'] || '-'}</td>
        <td>${item.Thinh || item['Thịnh'] || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Hàm Xóa các mục đã được tích chọn
  function deleteSelectedHistory() {
    const selectedCheckboxes = document.querySelectorAll(".row-checkbox:checked");
    
    if (selectedCheckboxes.length === 0) {
      alert("⚠️ Vui lòng tích chọn ít nhất 1 mục lịch sử cần xóa!");
      return;
    }

    const selectedDates = Array.from(selectedCheckboxes).map(cb => cb.value);

    if (!confirm(`Bạn có chắc chắn muốn xóa ${selectedDates.length} mục lịch sử đã chọn?`)) return;

    const payload = {
      action: "delete_selected",
      type: currentTab,
      dates: JSON.stringify(selectedDates)
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === "success") {
        alert("✅ " + (data.message || "Đã xóa thành công các mục được chọn!"));
        location.reload();
      } else {
        alert("❌ Lỗi: " + data.error);
      }
    })
    .catch(err => {
      alert("❌ Lỗi kết nối!");
      console.error(err);
    });
  }

  // Gửi Form Báo Cáo
  function submitForm(event, type) {
    event.preventDefault();
    let payload = { type: type };

    if (type === '8h') {
      const dateVal = document.getElementById('date8h').value;
      const parts = dateVal.split('-');
      payload.date = `${parts[2]}/${parts[1]}/${parts[0]}`;
      
      payload.statusMap = JSON.stringify({
        "Vũ": document.getElementById('ktv_Vu').value,
        "Hậu": document.getElementById('ktv_Hau').value,
        "Hoàng": document.getElementById('ktv_Hoang').value,
        "Tùng": document.getElementById('ktv_Tung').value,
        "Thịnh": document.getElementById('ktv_Thinh').value
      });
    } else {
      const dateVal = document.getElementById('date17h').value;
      const parts = dateVal.split('-');
      payload.date = `${parts[2]}/${parts[1]}/${parts[0]}`;
      
      const selectedKTVs = Array.from(document.querySelectorAll('input[name="ktv17"]:checked')).map(cb => cb.value);
      payload.selectedKTVs = selectedKTVs.join(', ');
      payload.hours = document.getElementById('hours17h').value;
      payload.thoiGian = document.getElementById('thoiGian17h').value;
    }

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        alert('✅ Báo cáo thành công!');
        location.reload();
      } else {
        alert('❌ Lỗi: ' + data.error);
      }
    })
    .catch(err => alert('❌ Lỗi kết nối!'));
  }
</script>

</body>
</html>
