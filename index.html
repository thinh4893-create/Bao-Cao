<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tự Động - F4 AUTO</title>

    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/ios-filled/180/000000/car.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/ios-filled/32/000000/car.png">
    
    <meta name="apple-mobile-web-app-title" content="F4 AUTO">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; padding: 15px; color: #1c1c1e; }
        .container { max-width: 680px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; color: #007aff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .date-picker-box { background: #eef6ff; border: 1px solid #007aff; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .date-picker-box label { font-size: 13px; font-weight: bold; color: #007aff; }
        .date-picker-box input[type="date"] { padding: 6px 10px; border-radius: 6px; border: 1px solid #007aff; font-size: 14px; font-weight: bold; color: #1c1c1e; outline: none; background: #fff; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #e5e5ea; padding: 4px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: #8e8e93; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: #ffffff; color: #007aff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: #3a3a3c; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d1d6; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        input:focus, select:focus, textarea:focus { border-color: #007aff; background: #fff; }
        input[readonly] { background-color: #e5e5ea; color: #636366; cursor: not-allowed; border-color: #d1d1d6; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; background: #fafafa; padding: 12px; border: 1px solid #d1d1d6; border-radius: 6px; }
        
        /* KTV OT Card Style */
        .ktv-ot-item { background: #ffffff; border: 1px solid #d1d1d6; border-radius: 8px; padding: 10px 12px; transition: 0.2s; }
        .ktv-ot-item.selected { border-color: #007aff; background: #f4f8ff; }
        .ktv-ot-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .ktv-ot-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #1c1c1e; cursor: pointer; }
        .ktv-ot-label input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .ktv-ot-time-selects { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #c7c7cc; grid-template-columns: 1fr 1fr; gap: 8px; }
        .ktv-ot-item.selected .ktv-ot-time-selects { display: grid; }
        .time-box-sub { display: flex; flex-direction: column; gap: 2px; }
        .time-box-sub label { font-size: 11px; color: #636366; font-weight: normal; }
        .time-box-sub select { padding: 4px 6px; font-size: 13px; font-weight: 600; }
        .ot-hours-badge { font-size: 12px; font-weight: bold; color: #007aff; background: #eef6ff; padding: 2px 8px; border-radius: 12px; }

        .ktv-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e5e5ea; background: #fafafa; }
        .ktv-row:last-child { border-bottom: none; }
        .ktv-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
        .ktv-select-status { width: auto; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #c7c7cc; background: #ffffff; }

        /* Quản lý KTV UI */
        .ktv-manage-box { background: #f8f9fa; border: 1px dashed #007aff; padding: 12px; border-radius: 8px; margin-top: 20px; }
        .ktv-manage-inputs { display: flex; gap: 8px; margin-bottom: 8px; }
        .ktv-manage-inputs input { flex: 1; }
        .btn-add-ktv { background: #007aff; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .ktv-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .ktv-tag { background: #e5e5ea; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .ktv-tag .remove-btn { color: #ff3b30; cursor: pointer; font-weight: bold; font-size: 14px; margin-left: 2px; }

        .output-box { margin-top: 20px; padding: 15px; background: #f9f9fb; border-radius: 8px; border: 1px solid #e5e5ea; }
        .output-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #1c1c1e; }
        .output-content { white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #d1d1d6; min-height: 120px; color: #000; line-height: 1.5; }
        
        .button-group { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 12px; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-copy { background: #34c759; }
        .btn-copy:hover { background: #28a745; }
        .btn-sync { background: #007aff; }
        .btn-sync:hover { background: #0056b3; }

        .stats-box { margin-top: 20px; background: linear-gradient(135deg, #2b56f5 0%, #1e3cc6 100%); border-radius: 18px; padding: 20px; color: #ffffff; box-shadow: 0 8px 20px rgba(30, 60, 198, 0.25); }
        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 12px; }
        .stats-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .month-selector-badge { background: #ffffff; color: #1c1c1e; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
        .month-selector-badge select { border: none; background: transparent; font-weight: bold; font-size: 13px; color: #1c1c1e; outline: none; cursor: pointer; padding: 0; width: auto; }
        
        .stats-section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin: 15px 0 10px 0; display: flex; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.9); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; padding: 12px 6px; text-align: center; }
        .stat-card .ktv-label { font-size: 13px; font-weight: 800; color: #ffffff; margin-bottom: 4px; text-transform: uppercase; }
        .stat-card .stat-val { font-size: 15px; font-weight: 800; color: #ffeb3b; }

        .history-box { margin-top: 20px; padding: 15px; background: #ffffff; border-radius: 8px; border: 1px solid #d1d1d6; }
        .history-title { font-size: 15px; font-weight: bold; color: #1c1c1e; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .history-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid #e5e5ea; padding-bottom: 8px; }
        .sub-tab-btn { flex: 1; padding: 6px; border: none; background: #f2f2f7; font-size: 12px; font-weight: bold; color: #636366; border-radius: 6px; cursor: pointer; }
        .sub-tab-btn.active { background: #007aff; color: #ffffff; }

        .history-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .history-item { background: #f2f2f7; border-radius: 6px; border-left: 4px solid #007aff; overflow: hidden; }
        .history-item-header { padding: 10px 12px; font-size: 13px; font-weight: bold; color: #3a3a3c; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-header-left { display: flex; align-items: center; gap: 8px; flex: 1; }
        .history-item-header:hover { background: #e5e5ea; }
        .history-item-body { display: none; padding: 10px 12px; color: #3a3a3c; font-size: 13px; white-space: pre-wrap; border-top: 1px solid #e5e5ea; background: #ffffff; line-height: 1.4; }
        .history-item.open .history-item-body { display: block; }
        .history-item.open .arrow { transform: rotate(180deg); }
        .arrow { transition: transform 0.2s ease; font-size: 10px; color: #8e8e93; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #fff; padding: 25px 30px; border-radius: 14px; text-align: center; }
        .modal-card .icon { font-size: 40px; color: #34c759; margin-bottom: 10px; }
        .modal-card p { font-size: 16px; font-weight: bold; color: #1c1c1e; }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1> BÁO CÁO F4 AUTO - TAM TRINH</h1>

    <div class="date-picker-box">
        <label>📅 Chọn Ngày Báo Cáo:</label>
        <input type="date" id="selectedDate" onchange="updateAllRenders()">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab8h', event)">1. Đầu giờ (8H)</button>
        <button class="tab-btn" onclick="switchTab('tab17h', event)">2. Tăng ca (17H)</button>
        <button class="tab-btn" onclick="switchTab('tab18h', event)">3. Cuối ngày (18H)</button>
    </div>

    <!-- FORM 8H -->
    <div id="tab8h" class="form-section active">
        <div class="form-grid">
            <input type="hidden" id="coSo_8h" value="Tam Trinh">
            <input type="hidden" id="thoiGian_8h" value="08:00">

            <div class="form-group">
                <label>Số lượng Quản lý:</label>
                <input type="text" id="quanLy_8h" value="01" readonly>
            </div>
            <div class="form-group">
                <label>Số lượng Sale Off:</label>
                <input type="number" id="saleOff_8h" value="0" min="0" oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Số Kế toán văn phòng:</label>
                <input type="text" id="keToan_8h" value="01" readonly>
            </div>

            <div class="form-group full-width">
                <label>Trạng thái Kỹ thuật viên hôm nay:</label>
                <div id="ktvStatusContainer" style="border: 1px solid #d1d1d6; border-radius: 6px; overflow: hidden;">
                    <!-- Render tự động danh sách KTV -->
                </div>
            </div>

            <div class="form-group">
                <label>Dự kiến nghỉ ngày mai:</label>
                <input type="text" id="nghiMai_8h" value="Chưa có." oninput="render8h()">
            </div>
            <div class="form-group">
                <label>Đi muộn:</label>
                <input type="text" id="diMuon_8h" value="Không có." oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Ghi chú bổ sung cho mục Chi tiết (nếu có):</label>
                <input type="text" id="chiTiet_8h" value="" placeholder="Nhập thêm ghi chú khác nếu cần..." oninput="render8h()">
            </div>
        </div>
    </div>

    <!-- FORM 17H -->
    <div id="tab17h" class="form-section">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Loại hình báo cáo:</label>
                <div class="checkbox-group" style="flex-direction: row;">
                    <label class="checkbox-item" style="display:flex; align-items:center; gap:6px;"><input type="radio" name="otMode" value="ĐĂNG KÝ TĂNG CA" checked onchange="render17h()"> Đăng Ký Tăng Ca</label>
                    <label class="checkbox-item" style="display:flex; align-items:center; gap:6px;"><input type="radio" name="otMode" value="BÁO CÁO TĂNG CA" onchange="render17h()"> Báo Cáo Tăng Ca</label>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Nội dung công việc:</label>
                <textarea id="congViec_17h" rows="3" placeholder="Nhập nội dung công việc..." oninput="render17h()"></textarea>
            </div>

            <div class="form-group full-width">
                <label>Chọn Kỹ thuật viên & Khung giờ tăng ca riêng:</label>
                <div class="checkbox-group" id="ktv17hContainer">
                    <!-- Render linh hoạt KTV + Chọn giờ riêng -->
                </div>
            </div>
        </div>
    </div>

    <!-- FORM 18H -->
    <div id="tab18h" class="form-section">
        <div class="form-grid">
            <div class="form-group full-width"><label>Dán phim cách nhiệt:</label><input type="text" id="danPhim_18h" placeholder="Ví dụ: 2 xe..." oninput="render18h()"></div>
            <div class="form-group full-width"><label>PPF:</label><input type="text" id="ppf_18h" placeholder="Ví dụ: 1 xe..." oninput="render18h()"></div>
            <div class="form-group full-width"><label>Wrap:</label><input type="text" id="wrap_18h" value="" placeholder="Nhập tình trạng Wrap..." oninput="render18h()"></div>
            
            <div class="form-group full-width">
                <label>Ghi chú:</label>
                <textarea id="ghiChu_18h" rows="5" placeholder="Nhập ghi chú chi tiết tại đây..." oninput="render18h()"></textarea>
            </div>

            <div class="form-group full-width"><label>Số lỗi:</label><input type="text" id="soLoi_18h" value="0" oninput="render18h()"></div>
            <div class="form-group"><label>Lỗi chất lượng khi giao xe:</label><input type="text" id="loi1_18h" value="0" oninput="render18h()"></div>
            <div class="form-group"><label>Lỗi đồng phục không tuân thủ:</label><input type="text" id="loi2_18h" value="0" oninput="render18h()"></div>
            <div class="form-group"><label>Lỗi 5S tại cơ sở:</label><input type="text" id="loi3_18h" value="0" oninput="render18h()"></div>
            <div class="form-group"><label>Các lỗi khác:</label><input type="text" id="loi4_18h" value="Không có" oninput="render18h()"></div>
            <div class="form-group full-width"><label>Thiết bị điện các khu vực không sử dụng:</label><input type="text" id="loi5_18h" value="đã được tắt đầy đủ." oninput="render18h()"></div>
        </div>
    </div>

    <!-- KHUNG XUẤT KẾT QUẢ -->
    <div class="output-box">
        <div class="output-header">Nội dung báo cáo copy:</div>
        <div id="reportOutput" class="output-content"></div>

        <div class="button-group">
            <button class="btn btn-copy" onclick="copyReport()">Sao Chép Báo Cáo</button>
            <button class="btn btn-sync" id="btnSync" onclick="sendToGoogleSheet()">Gửi Lên Google Sheet</button>
        </div>
    </div>

    <!-- KHUNG QUẢN LÝ KTV -->
    <div class="ktv-manage-box">
        <label>🛠 Quản lý danh sách Kỹ thuật viên (Thêm / Xóa):</label>
        <div class="ktv-manage-inputs" style="margin-top: 6px;">
            <input type="text" id="newKtvName" placeholder="Nhập tên KTV mới...">
            <button class="btn-add-ktv" onclick="addNewKTV()">+ Thêm</button>
        </div>
        <div class="ktv-tags" id="ktvTagsList"></div>
    </div>

    <!-- BẢNG THỐNG KÊ THEO THÁNG -->
    <div class="stats-box">
        <div class="stats-header">
            <div class="stats-title">📊 Thống Kê Theo Tháng</div>
            <div class="month-selector-badge">
                <span>CHỌN THÁNG:</span>
                <select id="statsMonthSelect" onchange="loadMonthlyStats()"></select>
            </div>
        </div>

        <div class="stats-section-title">👨‍🔧 TỔNG SỐ NGÀY ĐI LÀM TRONG THÁNG</div>
        <div class="stats-grid" id="statsDaysGrid"></div>

        <div class="stats-section-title">⏰ TỔNG SỐ GIỜ TĂNG CA TRONG THÁNG</div>
        <div class="stats-grid" id="statsHoursGrid"></div>
    </div>

    <!-- LỊCH SỬ BÁO CÁO -->
    <div class="history-box">
        <div class="history-title">
            <span>📋 Lịch Sử Báo Cáo</span>
            <button onclick="refreshAllData()" style="border:1px solid #007aff; background:#fff; color:#007aff; font-size:12px; font-weight:bold; padding:5px 10px; border-radius:6px; cursor:pointer;">🔄 Tải lại dữ liệu</button>
        </div>
        
        <div class="history-tabs">
            <button class="sub-tab-btn active" onclick="switchHistoryTab('8h', event)">Lịch sử 8H</button>
            <button class="sub-tab-btn" onclick="switchHistoryTab('17h', event)">Lịch sử 17H</button>
        </div>

        <div id="historyList" class="history-list"></div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
        <div class="icon">✓</div>
        <p id="modalMsg">Đã gửi thành công</p>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZ_Zo53JqmoNCcnOdggkkEvmR1JX947SbURolMkpNWY8MtZIWsT4ukO_qV8ZX7wDI11w/exec";
    
    let ALL_KTV = JSON.parse(localStorage.getItem('F4_ALL_KTV')) || ["Vũ", "Hậu", "Hoàng", "Tùng", "Thịnh"];
    
    // Mốc thời gian Bắt đầu
    const START_TIME_OPTIONS = [
        "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", 
        "21:00", "21:30", "22:00", "22:30", "23:00", "23:30", "24:00"
    ];

    // Mốc thời gian Kết thúc (đã bỏ 18:00 và 18:30)
    const END_TIME_OPTIONS = [
        "19:00", "19:30", "20:00", "20:30", 
        "21:00", "21:30", "22:00", "22:30", "23:00", "23:30", "24:00"
    ];

    let currentTab = 'tab8h';
    let currentHistoryTab = '8h';

    window.onload = function() {
        setDefaultDate();
        initMonthOptions();
        renderKTVUI();
        render8h();
        switchHistoryTab('8h');
        loadMonthlyStats();
    };

    function saveKTVList() {
        localStorage.setItem('F4_ALL_KTV', JSON.stringify(ALL_KTV));
        renderKTVUI();
        updateAllRenders();
        loadMonthlyStats();
    }

    function addNewKTV() {
        const input = document.getElementById('newKtvName');
        const name = input.value.trim();
        if (name && !ALL_KTV.includes(name)) {
            ALL_KTV.push(name);
            input.value = '';
            saveKTVList();
        } else if (ALL_KTV.includes(name)) {
            alert('Tên KTV này đã có trong danh sách!');
        }
    }

    function removeKTV(name) {
        if (confirm(`Bạn có chắc chắn muốn xóa KTV "${name}" không?`)) {
            ALL_KTV = ALL_KTV.filter(item => item !== name);
            saveKTVList();
        }
    }

    function renderKTVUI() {
        const tagsContainer = document.getElementById('ktvTagsList');
        tagsContainer.innerHTML = ALL_KTV.map(name => 
            `<div class="ktv-tag">
                <span>${name}</span>
                <span class="remove-btn" onclick="removeKTV('${name}')">&times;</span>
             </div>`
        ).join('');

        const statusContainer = document.getElementById('ktvStatusContainer');
        statusContainer.innerHTML = ALL_KTV.map(ten => `
            <div class="ktv-row">
                <span class="ktv-name">${ten}</span>
                <select id="status_${ten}" class="ktv-select-status" onchange="render8h()">
                    <option value="Đi làm" selected>Đi làm</option>
                    <option value="Nghỉ">Nghỉ</option>
                    <option value="Nghỉ sáng">Nghỉ sáng</option>
                    <option value="Nghỉ chiều">Nghỉ chiều</option>
                </select>
            </div>
        `).join('');

        const otContainer = document.getElementById('ktv17hContainer');
        
        const generateOptions = (arrOptions, selectedVal) => {
            return arrOptions.map(t => `<option value="${t}" ${t === selectedVal ? 'selected' : ''}>${t}</option>`).join('');
        };

        otContainer.innerHTML = ALL_KTV.map(ten => `
            <div class="ktv-ot-item" id="card_ot_${ten}">
                <div class="ktv-ot-header">
                    <label class="ktv-ot-label">
                        <input type="checkbox" class="ktv-17h-checkbox" value="${ten}" onchange="toggleKtvOt('${ten}')"> ${ten}
                    </label>
                    <span class="ot-hours-badge" id="badge_hours_${ten}">0 tiếng</span>
                </div>
                <div class="ktv-ot-time-selects">
                    <div class="time-box-sub">
                        <label>Giờ bắt đầu:</label>
                        <select id="start_${ten}" onchange="render17h()">${generateOptions(START_TIME_OPTIONS, "18:00")}</select>
                    </div>
                    <div class="time-box-sub">
                        <label>Giờ kết thúc:</label>
                        <select id="end_${ten}" onchange="render17h()">${generateOptions(END_TIME_OPTIONS, "22:00")}</select>
                    </div>
                </div>
            </div>
        `).join('');

        const daysGrid = document.getElementById('statsDaysGrid');
        const hoursGrid = document.getElementById('statsHoursGrid');
        
        daysGrid.innerHTML = ALL_KTV.map(ktv => `
            <div class="stat-card">
                <div class="ktv-label">${ktv.toUpperCase()}</div>
                <div class="stat-val" id="days_${ktv}">0 ngày</div>
            </div>
        `).join('');

        hoursGrid.innerHTML = ALL_KTV.map(ktv => `
            <div class="stat-card">
                <div class="ktv-label">${ktv.toUpperCase()}</div>
                <div class="stat-val" id="hours_${ktv}">0h</div>
            </div>
        `).join('');
    }

    function toggleKtvOt(ten) {
        const card = document.getElementById(`card_ot_${ten}`);
        const cb = card.querySelector('.ktv-17h-checkbox');
        if (cb.checked) {
            card.classList.add('selected');
        } else {
            card.classList.remove('selected');
        }
        render17h();
    }

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('selectedDate').value = `${yyyy}-${mm}-${dd}`;
    }

    function initMonthOptions() {
        const select = document.getElementById('statsMonthSelect');
        select.innerHTML = '';
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth() + 1;

        for (let m = 1; m <= 12; m++) {
            const opt = document.createElement('option');
            const mmStr = String(m).padStart(2, '0');
            opt.value = `${mmStr}/${currentYear}`;
            opt.text = `tháng ${m} năm ${currentYear}`;
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function getSelectedDateFormatted() {
        const val = document.getElementById('selectedDate').value;
        if (!val) return "";
        const parts = val.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function fmt(val) {
        let num = parseInt(val, 10);
        if (isNaN(num)) return '00';
        return num < 10 && num >= 0 ? '0' + num : '' + num;
    }

    function updateAllRenders() {
        if (currentTab === 'tab8h') render8h();
        if (currentTab === 'tab17h') render17h();
        if (currentTab === 'tab18h') render18h();
    }

    function switchTab(tabId, evt) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

        if(evt) evt.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'tab8h') { render8h(); switchHistoryTab('8h'); }
        if (tabId === 'tab17h') { render17h(); switchHistoryTab('17h'); }
        if (tabId === 'tab18h') { render18h(); switchHistoryTab('18h'); }
    }

    function render8h() {
        const coSo = "Tam Trinh";
        const ngay = getSelectedDateFormatted();
        const thoiGian = document.getElementById('thoiGian_8h').value.trim();
        
        const quanLy = 1;
        const keToan = 1;
        const saleOff = parseInt(document.getElementById('saleOff_8h').value, 10) || 0;
        const ktvCoSo = ALL_KTV.length;

        const tongNhanLuc = quanLy + saleOff + ktvCoSo + keToan;

        let dsNghiText = [];
        let countKtvDiLam = 0;

        ALL_KTV.forEach(ten => {
            const el = document.getElementById(`status_${ten}`);
            if (el) {
                const status = el.value;
                if (status === "Đi làm") {
                    countKtvDiLam++;
                } else if (status === "Nghỉ") {
                    dsNghiText.push(`${ten} nghỉ.`);
                } else if (status === "Nghỉ sáng") {
                    countKtvDiLam++;
                    dsNghiText.push(`${ten} nghỉ buổi sáng.`);
                } else if (status === "Nghỉ chiều") {
                    countKtvDiLam++;
                    dsNghiText.push(`${ten} nghỉ buổi chiều.`);
                }
            }
        });

        const nhanSuDiLam = quanLy + saleOff + keToan + countKtvDiLam;

        const nghiMai = document.getElementById('nghiMai_8h').value.trim();
        const ghiChuBoSung = document.getElementById('chiTiet_8h').value.trim();
        const diMuon = document.getElementById('diMuon_8h').value.trim();

        let chiTietFull = [...dsNghiText];
        if (ghiChuBoSung !== "") {
            chiTietFull.push(ghiChuBoSung);
        }
        
        let chiTietFormatted = "";
        if (chiTietFull.length > 0) {
            chiTietFormatted = chiTietFull.map(item => `   •  ${item}`).join('\n');
        } else {
            chiTietFormatted = "   •";
        }

        const text = `BÁO CÁO TỶ LỆ ĐI LÀM KỸ THUẬT – F4 AUTO
Cơ sở: ${coSo}
Ngày: ${ngay}
Thời gian: ${thoiGian}
1. Tổng nhân lực: ${fmt(tongNhanLuc)}
   •  Quản lý: 01
   •  Sale Off: ${fmt(saleOff)}
   •  Kỹ thuật viên cơ sở: ${fmt(ktvCoSo)}
   •  Kế toán văn phòng: 01
2. Nhân sự đi làm: ${fmt(nhanSuDiLam)}
3. Dự kiến nghỉ ngày mai:
   •  ${nghiMai}
4. Chi tiết:
${chiTietFormatted}
5. Đi muộn:
   •  ${diMuon}

Em xin cảm ơn ạ!`;

        document.getElementById('reportOutput').innerText = text;
    }

    function calculateOtHours(startTimeVal, endTimeVal) {
        let [startH, startM] = startTimeVal.split(':').map(Number);
        let [endH, endM] = endTimeVal.split(':').map(Number);
        
        const startTotalMin = startH * 60 + startM;
        const endTotalMin = endH * 60 + endM;

        const diffMin = endTotalMin - startTotalMin;
        if (diffMin <= 0) return 0;
        return diffMin / 60;
    }

    function render17h() {
        const coSo = "Tam Trinh";
        const ngay = getSelectedDateFormatted();
        const modeRadio = document.querySelector('input[name="otMode"]:checked');
        const otTitle = modeRadio ? modeRadio.value : 'ĐĂNG KÝ TĂNG CA';
        const congViec = document.getElementById('congViec_17h').value.trim();

        let ktvDetailsText = [];
        
        ALL_KTV.forEach(ten => {
            const card = document.getElementById(`card_ot_${ten}`);
            if (card) {
                const cb = card.querySelector('.ktv-17h-checkbox');
                const startSelect = document.getElementById(`start_${ten}`);
                const endSelect = document.getElementById(`end_${ten}`);
                const badge = document.getElementById(`badge_hours_${ten}`);

                if (startSelect && endSelect) {
                    const startVal = startSelect.value;
                    const endVal = endSelect.value;
                    const hours = calculateOtHours(startVal, endVal);

                    if (badge) badge.innerText = `${hours} tiếng`;

                    if (cb && cb.checked) {
                        // Bỏ chữ KTV, chỉ giữ lại tên
                        ktvDetailsText.push(`+ ${ten}: từ ${startVal} đến ${endVal} (${hours} tiếng)`);
                    }
                }
            }
        });

        let ktvRenderText = "";
        if (ktvDetailsText.length > 0) {
            ktvRenderText = ktvDetailsText.join('\n');
        } else {
            ktvRenderText = "+ Chưa chọn nhân sự nào";
        }

        const text = `${otTitle}

– Ngày: ${ngay}
– Cơ sở: ${coSo}
– Kỹ thuật viên tăng ca:
${ktvRenderText}
– Nội dung công việc: ${congViec}

Em gửi ạ.`;

        document.getElementById('reportOutput').innerText = text;
    }

    function render18h() {
        const coSo = "Tam Trinh";
        const ngay = getSelectedDateFormatted();
        const danPhim = document.getElementById('danPhim_18h').value.trim();
        const ppf = document.getElementById('ppf_18h').value.trim();
        const wrap = document.getElementById('wrap_18h').value.trim();
        const ghiChu = document.getElementById('ghiChu_18h').value.trim();
        const soLoi = document.getElementById('soLoi_18h').value.trim();
        const loi1 = document.getElementById('loi1_18h').value.trim();
        const loi2 = document.getElementById('loi2_18h').value.trim();
        const loi3 = document.getElementById('loi3_18h').value.trim();
        const loi4 = document.getElementById('loi4_18h').value.trim();
        const loi5 = document.getElementById('loi5_18h').value.trim();

        const text = `BÁO CÁO CUỐI NGÀY

Cơ sở: ${coSo}
Ngày: ${ngay}
Tiến độ công việc
• Dán phim cách nhiệt: ${danPhim}
• PPF: ${ppf}
• Wrap: ${wrap}

• Số lỗi: ${soLoi}
Kiểm soát chất lượng
1. Lỗi chất lượng khi giao xe: ${loi1}
2. Lỗi đồng phục không tuân thủ: ${loi2}

    function copyReport(silent = false) {
        const text = document.getElementById('reportOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            if (!silent) {
                showSuccessPopup("Đã sao chép nội dung báo cáo!");
            }
        });
    }

    function resetFormToDefault() {
        setDefaultDate();

        // Reset Tab 8H
        document.getElementById('saleOff_8h').value = "0";
        ALL_KTV.forEach(ten => {
            const el = document.getElementById(`status_${ten}`);
            if (el) el.value = "Đi làm";
        });
        document.getElementById('nghiMai_8h').value = "Chưa có.";
        document.getElementById('diMuon_8h').value = "Không có.";
        document.getElementById('chiTiet_8h').value = "";

        // Reset Tab 17H
        ALL_KTV.forEach(ten => {
            const card = document.getElementById(`card_ot_${ten}`);
            if (card) {
                const cb = card.querySelector('.ktv-17h-checkbox');
                if (cb) cb.checked = false;
                card.classList.remove('selected');
            }
            const startSelect = document.getElementById(`start_${ten}`);
            const endSelect = document.getElementById(`end_${ten}`);
            if (startSelect) startSelect.value = "18:00";
            if (endSelect) endSelect.value = "22:00";
        });

        document.getElementById('congViec_17h').value = "";
        const defaultOtRadio = document.querySelector('input[name="otMode"][value="ĐĂNG KÝ TĂNG CA"]');
        if (defaultOtRadio) defaultOtRadio.checked = true;

        // Reset Tab 18H
        document.getElementById('danPhim_18h').value = "";
        document.getElementById('ppf_18h').value = "";
        document.getElementById('wrap_18h').value = "";
        document.getElementById('ghiChu_18h').value = "";
        document.getElementById('soLoi_18h').value = "0";
        document.getElementById('loi1_18h').value = "0";
        document.getElementById('loi2_18h').value = "0";
        document.getElementById('loi3_18h').value = "0";
        document.getElementById('loi4_18h').value = "Không có";
        document.getElementById('loi5_18h').value = "đã được tắt đầy đủ.";

        updateAllRenders();
    }

    function sendToGoogleSheet() {
        copyReport(true);

        const btnSync = document.getElementById('btnSync');
        btnSync.disabled = true;
        btnSync.innerText = "Đang gửi & copy...";

        const params = new URLSearchParams();
        const reportDate = getSelectedDateFormatted();

        if (currentTab === 'tab8h') {
            let statusMap = {};
            ALL_KTV.forEach(ten => {
                const el = document.getElementById(`status_${ten}`);
                if (el) statusMap[ten] = el.value;
            });

            params.append('type', '8h');
            params.append('date', reportDate);
            params.append('statusMap', JSON.stringify(statusMap));

        } else if (currentTab === 'tab17h') {
            let selectedKTVs = [];
            let ktvDetails = [];
            let totalOtHours = 0;

            ALL_KTV.forEach(ten => {
                const card = document.getElementById(`card_ot_${ten}`);
                if (card) {
                    const cb = card.querySelector('.ktv-17h-checkbox');
                    if (cb && cb.checked) {
                        const startVal = document.getElementById(`start_${ten}`).value;
                        const endVal = document.getElementById(`end_${ten}`).value;
                        const hours = calculateOtHours(startVal, endVal);

                        selectedKTVs.push(ten);
                        ktvDetails.push({
                            name: ten,
                            startTime: startVal,
                            endTime: endVal,
                            hours: hours
                        });
                        totalOtHours += hours;
                    }
                }
            });

            if (selectedKTVs.length === 0) {
                alert("Vui lòng chọn ít nhất 1 Kỹ thuật viên tăng ca!");
                btnSync.disabled = false;
                btnSync.innerText = "Gửi Lên Google Sheet";
                return;
            }

            params.append('type', '17h');
            params.append('date', reportDate);
            params.append('selectedKTVs', selectedKTVs.join(', '));
            params.append('ktvDetails', JSON.stringify(ktvDetails));
            params.append('hours', totalOtHours);

        } else {
            alert("Báo cáo 18H không gửi dữ liệu lên Google Sheet.");
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            return;
        }

        fetch(WEB_APP_URL, {
            method: "POST",
            body: params
        })
        .then(res => res.json())
        .then(data => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            showSuccessPopup("Đã gửi Google Sheet & Sao chép báo cáo!");
            resetFormToDefault();
            refreshAllData();
        })
        .catch(err => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            showSuccessPopup("Đã gửi Google Sheet & Sao chép báo cáo!");
            resetFormToDefault();
            refreshAllData();
        });
    }

    function showSuccessPopup(msg) {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalMsg').innerText = msg;
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.style.display = 'none'; }, 2500);
    }

    function switchHistoryTab(type, evt) {
        currentHistoryTab = type;
        document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));

        if(evt) {
            evt.target.classList.add('active');
        } else {
            const btns = document.querySelectorAll('.sub-tab-btn');
            if(type === '8h') btns[0].classList.add('active');
            if(type === '17h') btns[1].classList.add('active');
        }

        loadHistory();
    }

    function toggleHistoryItem(el) {
        el.closest('.history-item').classList.toggle('open');
    }

    function refreshAllData() {
        loadHistory();
        loadMonthlyStats();
    }

    function parseDateStr(str) {
        if (!str) return new Date(0);
        const match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (match) {
            return new Date(match[3], match[2] - 1, match[1]);
        }
        return new Date(0);
    }

    function loadHistory() {
        const listEl = document.getElementById('historyList');
        listEl.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:15px;">Đang tải lịch sử...</div>`;

        const monthStr = document.getElementById('statsMonthSelect').value || "";

        fetch(`${WEB_APP_URL}?action=getHistory&month=${encodeURIComponent(monthStr)}`)
        .then(res => res.json())
        .then(data => {
            if (data.status !== "success") {
                listEl.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:15px;">Không thể tải dữ liệu lịch sử.</div>`;
                return;
            }

            let historyData = (currentHistoryTab === '8h') ? data.history8h : data.history17h;

            if (!historyData || historyData.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:15px;">Chưa có lịch sử ${currentHistoryTab.toUpperCase()} trong tháng này.</div>`;
                return;
            }

            historyData.sort((a, b) => parseDateStr(a.content) - parseDateStr(b.content));

            listEl.innerHTML = historyData.map(item => {
                let details = [];
                if (item.extraData) {
                    for (let ktv in item.extraData) {
                        details.push(`${ktv}: ${item.extraData[ktv]}`);
                    }
                }
                const detailStr = details.length > 0 ? details.join(' | ') : item.content;

                return `
                    <div class="history-item">
                        <div class="history-item-header" onclick="toggleHistoryItem(this)">
                            <div class="history-header-left">
                                <span>📌 ${item.content}</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="history-item-body">${detailStr}</div>
                    </div>
                `;
            }).join('');
        })
        .catch(err => {
            listEl.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:15px;">Chưa có dữ liệu lịch sử hoặc lỗi kết nối.</div>`;
        });
    }

    function loadMonthlyStats() {
        const monthStr = document.getElementById('statsMonthSelect').value;
        if (!monthStr) return;

        fetch(`${WEB_APP_URL}?action=getMonthlyStats&month=${encodeURIComponent(monthStr)}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                ALL_KTV.forEach(ktv => {
                    const daysVal = data.days && data.days[ktv] !== undefined ? data.days[ktv] : 0;
                    const hoursVal = data.hours && data.hours[ktv] !== undefined ? data.hours[ktv] : 0;

                    const dayEl = document.getElementById(`days_${ktv}`);
                    const hourEl = document.getElementById(`hours_${ktv}`);
                    if (dayEl) dayEl.innerText = `${daysVal} ngày`;
                    if (hourEl) hourEl.innerText = `${hoursVal}h`;
                });
            }
        })
        .catch(err => {
            ALL_KTV.forEach(ktv => {
                const dayEl = document.getElementById(`days_${ktv}`);
                const hourEl = document.getElementById(`hours_${ktv}`);
                if (dayEl) dayEl.innerText = `0 ngày`;
                if (hourEl) hourEl.innerText = `0h`;
            });
        });
    }
