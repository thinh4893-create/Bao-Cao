<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tự Động - F4 AUTO</title>

    <!-- 1. ICON Ô TÔ KHI THÊM VÀO MÀN HÌNH CHÍNH (PWA / BOOKMARK ICON) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/emoji/192/sports-car.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/emoji/32/sports-car.png">
    <meta name="apple-mobile-web-app-title" content="F4 AUTO">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; padding: 15px; color: #1c1c1e; }
        .container { max-width: 680px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 20px; color: #007aff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #e5e5ea; padding: 4px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: #8e8e93; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: #ffffff; color: #007aff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: #3a3a3c; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px 12px; border: 1px solid #d1d1d6; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        input:focus, select:focus { border-color: #007aff; background: #fff; }
        input[readonly] { background-color: #e5e5ea; color: #636366; cursor: not-allowed; border-color: #d1d1d6; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; background: #fafafa; padding: 12px; border: 1px solid #d1d1d6; border-radius: 6px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; color: #1c1c1e; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }

        .ktv-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e5e5ea; background: #fafafa; }
        .ktv-row:last-child { border-bottom: none; }
        .ktv-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
        .ktv-select-status { width: auto; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #c7c7cc; background: #ffffff; }

        .output-box { margin-top: 20px; padding: 15px; background: #f9f9fb; border-radius: 8px; border: 1px solid #e5e5ea; }
        .output-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #1c1c1e; }
        .output-content { white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #d1d1d6; min-height: 120px; color: #000; line-height: 1.5; }
        
        .button-group { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 12px; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-copy { background: #34c759; }
        .btn-copy:hover { background: #28a745; }
        .btn-sync { background: #007aff; }
        .btn-sync:hover { background: #0056b3; }

        /* LỊCH SỬ BÁO CÁO BAN DƯỚI */
        .history-box { margin-top: 25px; padding: 15px; background: #ffffff; border-radius: 8px; border: 1px solid #d1d1d6; }
        .history-title { font-size: 15px; font-weight: bold; color: #1c1c1e; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: #f2f2f7; padding: 10px; border-radius: 6px; border-left: 4px solid #007aff; font-size: 13px; }
        .history-item-header { display: flex; justify-content: space-between; font-weight: bold; color: #3a3a3c; margin-bottom: 4px; }
        .history-item-body { color: #636366; white-space: pre-wrap; }
        
        /* Modal Popup */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #fff; padding: 25px 30px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; animation: popIn 0.2s ease-out; }
        .modal-card .icon { font-size: 40px; color: #34c759; margin-bottom: 10px; }
        .modal-card p { font-size: 16px; font-weight: bold; color: #1c1c1e; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .tab-btn { font-size: 11px; padding: 8px 2px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏎️ BÁO CÁO F4 AUTO - TAM TRINH</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab8h', event)">1. Đầu giờ (8H)</button>
        <button class="tab-btn" onclick="switchTab('tab17h', event)">2. Tăng ca (17H)</button>
        <button class="tab-btn" onclick="switchTab('tab18h', event)">3. Cuối ngày (18H)</button>
    </div>

    <!-- FORM 8H -->
    <div id="tab8h" class="form-section active">
        <div class="form-grid">
            <div class="form-group">
                <label>Cơ sở (Cố định):</label>
                <input type="text" id="coSo_8h" value="Tam Trinh" readonly>
            </div>
            <div class="form-group">
                <label>Thời gian:</label>
                <input type="text" id="thoiGian_8h" value="08:00" oninput="render8h()">
            </div>
            
            <div class="form-group">
                <label>Số lượng Quản lý:</label>
                <input type="text" id="quanLy_8h" value="01" readonly>
            </div>
            <div class="form-group">
                <label>Số lượng Sale Off:</label>
                <input type="number" id="saleOff_8h" value="0" min="0" oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Số Kế toán văn phòng:</label>
                <input type="text" id="keToan_8h" value="01" readonly>
            </div>

            <div class="form-group full-width">
                <label>Trạng thái Kỹ thuật viên hôm nay:</label>
                <div style="border: 1px solid #d1d1d6; border-radius: 6px; overflow: hidden;">
                    <div class="ktv-row">
                        <span class="ktv-name">Vũ</span>
                        <select id="status_Vũ" class="ktv-select-status" onchange="render8h()">
                            <option value="Đi làm" selected>Đi làm</option>
                            <option value="Nghỉ">Nghỉ</option>
                            <option value="Nghỉ sáng">Nghỉ sáng</option>
                            <option value="Nghỉ chiều">Nghỉ chiều</option>
                        </select>
                    </div>
                    <div class="ktv-row">
                        <span class="ktv-name">Hậu</span>
                        <select id="status_Hậu" class="ktv-select-status" onchange="render8h()">
                            <option value="Đi làm" selected>Đi làm</option>
                            <option value="Nghỉ">Nghỉ</option>
                            <option value="Nghỉ sáng">Nghỉ sáng</option>
                            <option value="Nghỉ chiều">Nghỉ chiều</option>
                        </select>
                    </div>
                    <div class="ktv-row">
                        <span class="ktv-name">Hoàng</span>
                        <select id="status_Hoàng" class="ktv-select-status" onchange="render8h()">
                            <option value="Đi làm" selected>Đi làm</option>
                            <option value="Nghỉ">Nghỉ</option>
                            <option value="Nghỉ sáng">Nghỉ sáng</option>
                            <option value="Nghỉ chiều">Nghỉ chiều</option>
                        </select>
                    </div>
                    <div class="ktv-row">
                        <span class="ktv-name">Tùng</span>
                        <select id="status_Tùng" class="ktv-select-status" onchange="render8h()">
                            <option value="Đi làm" selected>Đi làm</option>
                            <option value="Nghỉ">Nghỉ</option>
                            <option value="Nghỉ sáng">Nghỉ sáng</option>
                            <option value="Nghỉ chiều">Nghỉ chiều</option>
                        </select>
                    </div>
                    <div class="ktv-row">
                        <span class="ktv-name">Thịnh</span>
                        <select id="status_Thịnh" class="ktv-select-status" onchange="render8h()">
                            <option value="Đi làm" selected>Đi làm</option>
                            <option value="Nghỉ">Nghỉ</option>
                            <option value="Nghỉ sáng">Nghỉ sáng</option>
                            <option value="Nghỉ chiều">Nghỉ chiều</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Dự kiến nghỉ ngày mai:</label>
                <input type="text" id="nghiMai_8h" value="Chưa có." oninput="render8h()">
            </div>
            <div class="form-group">
                <label>Đi muộn:</label>
                <input type="text" id="diMuon_8h" value="Không có." oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Ghi chú bổ sung cho mục Chi tiết (nếu có):</label>
                <input type="text" id="chiTiet_8h" value="" placeholder="Nhập thêm ghi chú khác nếu cần..." oninput="render8h()">
            </div>
        </div>
    </div>

    <!-- FORM 17H -->
    <div id="tab17h" class="form-section">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Cơ sở (Cố định):</label>
                <input type="text" id="coSo_17h" value="Tam Trinh" readonly>
            </div>
            <div class="form-group full-width">
                <label>Chọn Kỹ thuật viên tăng ca:</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Vũ" onchange="render17h()"> Vũ</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Hậu" onchange="render17h()"> Hậu</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Hoàng" onchange="render17h()"> Hoàng</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Tùng" onchange="render17h()"> Tùng</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Thịnh" onchange="render17h()"> Thịnh</label>
                </div>
            </div>
            <div class="form-group full-width">
                <label>Nội dung công việc:</label>
                <input type="text" id="congViec_17h" placeholder="Nhập nội dung công việc..." oninput="render17h()">
            </div>
            <div class="form-group full-width">
                <label>Thời gian tăng ca đến:</label>
                <select id="thoiGian_17h" onchange="render17h()">
                    <option value="20:00">20:00</option>
                    <option value="21:00">21:00</option>
                    <option value="22:00" selected>22:00</option>
                </select>
            </div>
        </div>
    </div>

    <!-- FORM 18H -->
    <div id="tab18h" class="form-section">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Cơ sở (Cố định):</label>
                <input type="text" id="coSo_18h" value="Tam Trinh" readonly>
            </div>
            <div class="form-group full-width">
                <label>Dán phim cách nhiệt:</label>
                <input type="text" id="danPhim_18h" placeholder="Ví dụ: 2 xe..." oninput="render18h()">
            </div>
            <div class="form-group full-width">
                <label>PPF:</label>
                <input type="text" id="ppf_18h" placeholder="Ví dụ: 1 xe..." oninput="render18h()">
            </div>
            <div class="form-group full-width">
                <label>Wrap:</label>
                <input type="text" id="wrap_18h" value="" placeholder="Nhập tình trạng Wrap..." oninput="render18h()">
            </div>
            <div class="form-group full-width">
                <label>Ghi chú:</label>
                <input type="text" id="ghiChu_18h" value="" placeholder="Nhập ghi chú nếu có..." oninput="render18h()">
            </div>
            <div class="form-group full-width">
                <label>Số lỗi:</label>
                <input type="text" id="soLoi_18h" value="0" placeholder="Nhập số lỗi..." oninput="render18h()">
            </div>
            <div class="form-group">
                <label>Lỗi chất lượng khi giao xe:</label>
                <input type="text" id="loi1_18h" value="0" oninput="render18h()">
            </div>
            <div class="form-group">
                <label>Lỗi đồng phục không tuân thủ:</label>
                <input type="text" id="loi2_18h" value="0" oninput="render18h()">
            </div>
            <div class="form-group">
                <label>Lỗi 5S tại cơ sở:</label>
                <input type="text" id="loi3_18h" value="0" oninput="render18h()">
            </div>
            <div class="form-group">
                <label>Các lỗi khác:</label>
                <input type="text" id="loi4_18h" value="Không có" oninput="render18h()">
            </div>
            <div class="form-group full-width">
                <label>Thiết bị điện các khu vực không sử dụng:</label>
                <input type="text" id="loi5_18h" value="đã được tắt đầy đủ." oninput="render18h()">
            </div>
        </div>
    </div>

    <!-- KHUNG XUẤT KẾT QUẢ -->
    <div class="output-box">
        <div class="output-header">Nội dung báo cáo copy:</div>
        <div id="reportOutput" class="output-content"></div>
        
        <div class="button-group">
            <button class="btn btn-copy" onclick="copyReport()">Sao Chép Báo Cáo</button>
            <button class="btn btn-sync" id="btnSync" onclick="sendToGoogleSheet()">Gửi Lên Google Sheet</button>
        </div>
    </div>

    <!-- 4. LỊCH SỬ BÁO CÁO (TRONG VÒNG 1 THÁNG) -->
    <div class="history-box">
        <div class="history-title">
            <span>📋 Lịch Sử Báo Cáo (30 Ngày Qua)</span>
            <button onclick="clearOldHistory()" style="border:none; background:transparent; color:#ff3b30; font-size:12px; cursor:pointer;">Xóa lịch sử</button>
        </div>
        <div id="historyList" class="history-list">
            <div style="text-align:center; color:#8e8e93; padding:10px;">Chưa có lịch sử báo cáo nào.</div>
        </div>
    </div>
</div>

<!-- POPUP MODAL NOTIFICATION -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
        <div class="icon">✓</div>
        <p id="modalMsg">Đã tải lên thành công</p>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3mKtfYrC47oE2lvRIcxGe-a83ThowjqkjeqzxQYXJ1GOS13tMTrxBvLrFwKPD0b0/exec";
    const ALL_KTV = ["Vũ", "Hậu", "Hoàng", "Tùng", "Thịnh"];
    let currentTab = 'tab8h';

    function fmt(val) {
        let num = parseInt(val, 10);
        if (isNaN(num)) return '00';
        return num < 10 && num >= 0 ? '0' + num : '' + num;
    }

    function getTodayString() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    function switchTab(tabId, evt) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

        if(evt) evt.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'tab8h') render8h();
        if (tabId === 'tab17h') render17h();
        if (tabId === 'tab18h') render18h();
    }

    function render8h() {
        const coSo = "Tam Trinh";
        const ngay = getTodayString();
        const thoiGian = document.getElementById('thoiGian_8h').value.trim();
        
        const quanLy = 1;
        const keToan = 1;
        const saleOff = parseInt(document.getElementById('saleOff_8h').value, 10) || 0;
        const ktvCoSo = ALL_KTV.length;

        const tongNhanLuc = quanLy + saleOff + ktvCoSo + keToan;

        let dsNghiText = [];
        let countKtvDiLam = 0;

        ALL_KTV.forEach(ten => {
            const status = document.getElementById(`status_${ten}`).value;
            if (status === "Đi làm") {
                countKtvDiLam++;
            } else if (status === "Nghỉ") {
                dsNghiText.push(`${ten} nghỉ.`);
            } else if (status === "Nghỉ sáng") {
                countKtvDiLam++;
                dsNghiText.push(`${ten} nghỉ buổi sáng.`);
            } else if (status === "Nghỉ chiều") {
                countKtvDiLam++;
                dsNghiText.push(`${ten} nghỉ buổi chiều.`);
            }
        });

        const nhanSuDiLam = quanLy + saleOff + keToan + countKtvDiLam;

        const nghiMai = document.getElementById('nghiMai_8h').value.trim();
        const ghiChuBoSung = document.getElementById('chiTiet_8h').value.trim();
        const diMuon = document.getElementById('diMuon_8h').value.trim();

        let chiTietFull = [...dsNghiText];
        if (ghiChuBoSung !== "") {
            chiTietFull.push(ghiChuBoSung);
        }
        
        let chiTietFormatted = "   •  Khái quát ổn định.";
        if (chiTietFull.length > 0) {
            chiTietFormatted = chiTietFull.map(item => `   •  ${item}`).join('\n');
        }

        const text = `BÁO CÁO TỶ LỆ ĐI LÀM KỸ THUẬT – F4 AUTO
Cơ sở: ${coSo}
Ngày: ${ngay}
Thời gian: ${thoiGian}
1. Tổng nhân lực: ${fmt(tongNhanLuc)}
   •  Quản lý: 01
   •  Sale Off: ${fmt(saleOff)}
   •  Kỹ thuật viên cơ sở: ${fmt(ktvCoSo)}
   •  Kế toán văn phòng: 01
2. Nhân sự đi làm: ${fmt(nhanSuDiLam)}
3. Dự kiến nghỉ ngày mai:
   •  ${nghiMai}
4. Chi tiết:
${chiTietFormatted}
5. Đi muộn:
   •  ${diMuon}

Em xin cảm ơn ạ!`;

        document.getElementById('reportOutput').innerText = text;
    }

    function getFormattedOvertimePeriod(endTimeVal) {
        if (endTimeVal === "20:00") return "19:00 - 20:00 (1 giờ)";
        if (endTimeVal === "21:00") return "19:00 - 21:00 (2 giờ)";
        if (endTimeVal === "22:00") return "19:00 - 22:00 (3 giờ)";
        return `19:00 - ${endTimeVal}`;
    }

    function getHoursValue(endTimeVal) {
        if (endTimeVal === "20:00") return 1;
        if (endTimeVal === "21:00") return 2;
        if (endTimeVal === "22:00") return 3;
        return 0;
    }

    function render17h() {
        const coSo = "Tam Trinh";
        const checkedBoxes = document.querySelectorAll('.ktv-17h-checkbox:checked');
        const selectedKTV = Array.from(checkedBoxes).map(cb => cb.value).join(', ');
        const congViec = document.getElementById('congViec_17h').value.trim();
        const endTime = document.getElementById('thoiGian_17h').value;
        
        const thoiGianFormatted = getFormattedOvertimePeriod(endTime);

        const text = `ĐĂNG KÝ TĂNG CA

– Cơ sở: ${coSo}
– Kỹ thuật viên: ${selectedKTV || 'Chưa chọn'}
– Nội dung công việc: ${congViec}
– Thời gian tăng ca: ${thoiGianFormatted}

Em gửi ạ.`;

        document.getElementById('reportOutput').innerText = text;
    }

    function render18h() {
        const coSo = "Tam Trinh";
        const ngay = getTodayString();
        const danPhim = document.getElementById('danPhim_18h').value.trim();
        const ppf = document.getElementById('ppf_18h').value.trim();
        const wrap = document.getElementById('wrap_18h').value.trim();
        const ghiChu = document.getElementById('ghiChu_18h').value.trim();
        const soLoi = document.getElementById('soLoi_18h').value.trim();
        const loi1 = document.getElementById('loi1_18h').value.trim();
        const loi2 = document.getElementById('loi2_18h').value.trim();
        const loi3 = document.getElementById('loi3_18h').value.trim();
        const loi4 = document.getElementById('loi4_18h').value.trim();
        const loi5 = document.getElementById('loi5_18h').value.trim();

        const text = `BÁO CÁO CUỐI NGÀY

Cơ sở: ${coSo}
Ngày: ${ngay}
Tiến độ công việc
• Dán phim cách nhiệt: ${danPhim}
• PPF: ${ppf}
• Wrap: ${wrap}
• Ghi chú: ${ghiChu}
• Số lỗi: ${soLoi}
Kiểm soát chất lượng
1. Lỗi chất lượng khi giao xe: ${loi1}
2. Lỗi đồng phục không tuân thủ: ${loi2}
3. Lỗi 5S tại cơ sở: ${loi3}
4. Các lỗi khác: ${loi4}
5. Thiết bị điện tại các khu vực không sử dụng ${loi5}

Em báo cáo ạ.`;

        document.getElementById('reportOutput').innerText = text;
    }

    function copyReport() {
        const text = document.getElementById('reportOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            showSuccessPopup("Đã sao chép nội dung báo cáo!");
            saveToHistory("Sao chép", text);
        });
    }

    function sendToGoogleSheet() {
        const btnSync = document.getElementById('btnSync');
        btnSync.disabled = true;
        btnSync.innerText = "Đang gửi...";

        const params = new URLSearchParams();
        const reportText = document.getElementById('reportOutput').innerText;

        if (currentTab === 'tab8h') {
            let statusMap = {};
            ALL_KTV.forEach(ten => {
                statusMap[ten] = document.getElementById(`status_${ten}`).value;
            });

            params.append('type', '8h');
            params.append('date', getTodayString());
            params.append('statusMap', JSON.stringify(statusMap));

        } else if (currentTab === 'tab17h') {
            const checkedBoxes = document.querySelectorAll('.ktv-17h-checkbox:checked');
            const selectedKTVs = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedKTVs.length === 0) {
                alert("Vui lòng chọn ít nhất 1 Kỹ thuật viên tăng ca!");
                btnSync.disabled = false;
                btnSync.innerText = "Gửi Lên Google Sheet";
                return;
            }

            const endTime = document.getElementById('thoiGian_17h').value;

            params.append('type', '17h');
            params.append('date', getTodayString());
            params.append('selectedKTVs', selectedKTVs.join(', '));
            params.append('hours', getHoursValue(endTime));
            params.append('congViec', document.getElementById('congViec_17h').value.trim());
            params.append('thoiGian', getFormattedOvertimePeriod(endTime));
        } else {
            alert("Báo cáo 18H không đẩy dữ liệu lên Google Sheet.");
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            saveToHistory("Lưu máy (18H)", reportText);
            return;
        }

        fetch(WEB_APP_URL, {
            method: "POST",
            body: params
        })
        .then(res => res.json())
        .then(data => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            showSuccessPopup("Đã tải lên thành công");
            saveToHistory("Đã gửi Sheet", reportText);
        })
        .catch(err => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            showSuccessPopup("Đã tải lên thành công");
            saveToHistory("Đã gửi Sheet", reportText);
        });
    }

    function showSuccessPopup(msg) {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalMsg').innerText = msg;
        overlay.style.display = 'flex';

        setTimeout(() => {
            overlay.style.display = 'none';
        }, 3000);
    }

    // LƯU & XEM LỊCH SỬ BÁO CÁO (30 NGÀY QUẢN LÝ)
    function saveToHistory(actionType, content) {
        let history = JSON.parse(localStorage.getItem('f4_report_history') || '[]');
        const now = new Date();
        
        const newItem = {
            id: Date.now(),
            time: `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} - ${getTodayString()}`,
            timestamp: now.getTime(),
            action: actionType,
            content: content
        };

        history.unshift(newItem);

        // Lọc lịch sử chỉ giữ lại trong vòng 30 ngày (30 * 24 * 60 * 60 * 1000 ms)
        const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
        history = history.filter(item => item.timestamp >= thirtyDaysAgo);

        localStorage.setItem('f4_report_history', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('f4_report_history') || '[]');
        const listEl = document.getElementById('historyList');

        if (history.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:10px;">Chưa có lịch sử báo cáo nào.</div>`;
            return;
        }

        listEl.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="history-item-header">
                    <span>${item.time} (${item.action})</span>
                </div>
                <div class="history-item-body">${item.content}</div>
            </div>
        `).join('');
    }

    function clearOldHistory() {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử lưu trên máy này?")) {
            localStorage.removeItem('f4_report_history');
            loadHistory();
        }
    }

    window.onload = function() {
        render8h();
        loadHistory();
    };
</script>
