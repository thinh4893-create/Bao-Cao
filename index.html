<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tự Động - F4 AUTO</title>

    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/emoji/192/sports-car.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/emoji/32/sports-car.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; padding: 15px; color: #1c1c1e; }
        .container { max-width: 680px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; color: #007aff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .date-picker-box { background: #eef6ff; border: 1px solid #007aff; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .date-picker-box label { font-size: 13px; font-weight: bold; color: #007aff; }
        .date-picker-box input[type="date"] { padding: 6px 10px; border-radius: 6px; border: 1px solid #007aff; font-size: 14px; font-weight: bold; color: #1c1c1e; outline: none; background: #fff; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #e5e5ea; padding: 4px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: #8e8e93; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: #ffffff; color: #007aff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: #3a3a3c; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px 12px; border: 1px solid #d1d1d6; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        input:focus, select:focus { border-color: #007aff; background: #fff; }
        input[readonly] { background-color: #e5e5ea; color: #636366; cursor: not-allowed; border-color: #d1d1d6; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; background: #fafafa; padding: 12px; border: 1px solid #d1d1d6; border-radius: 6px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; color: #1c1c1e; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }

        .ktv-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e5e5ea; background: #fafafa; }
        .ktv-row:last-child { border-bottom: none; }
        .ktv-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
        .ktv-select-status { width: auto; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #c7c7cc; background: #ffffff; }

        .output-box { margin-top: 20px; padding: 15px; background: #f9f9fb; border-radius: 8px; border: 1px solid #e5e5ea; }
        .output-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #1c1c1e; }
        .output-content { white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #d1d1d6; min-height: 120px; color: #000; line-height: 1.5; }
        
        .button-group { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 12px; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-copy { background: #34c759; }
        .btn-copy:hover { background: #28a745; }
        .btn-sync { background: #007aff; }
        .btn-sync:hover { background: #0056b3; }

        .stat-card { margin-top: 25px; background: linear-gradient(135deg, #2557e0 0%, #3e33c7 100%); border-radius: 14px; padding: 20px; color: #ffffff; box-shadow: 0 8px 20px rgba(37, 87, 224, 0.25); }
        .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 12px; }
        .stat-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
        .stat-month-select { background: #ffffff; color: #1c1c1e; font-weight: bold; padding: 6px 12px; border-radius: 8px; border: none; outline: none; font-size: 13px; cursor: pointer; }
        
        .stat-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; opacity: 0.9; }
        .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat-item-box { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px 5px; text-align: center; backdrop-filter: blur(5px); }
        .stat-item-box .ktv-label { font-size: 12px; font-weight: 700; opacity: 0.9; margin-bottom: 4px; text-transform: uppercase; }
        .stat-item-box .ktv-val { font-size: 15px; font-weight: 800; color: #ffe600; }

        .history-box { margin-top: 20px; padding: 15px; background: #ffffff; border-radius: 8px; border: 1px solid #d1d1d6; }
        .history-title { font-size: 15px; font-weight: bold; color: #1c1c1e; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .history-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid #e5e5ea; padding-bottom: 8px; }
        .sub-tab-btn { flex: 1; padding: 6px; border: none; background: #f2f2f7; font-size: 12px; font-weight: bold; color: #636366; border-radius: 6px; cursor: pointer; }
        .sub-tab-btn.active { background: #007aff; color: #ffffff; }

        .history-list { max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: #f8f9fa; border-radius: 8px; border: 1px solid #e5e5ea; border-left: 4px solid #007aff; overflow: hidden; }
        .history-item-header { padding: 8px 12px; font-size: 13px; font-weight: bold; color: #3a3a3c; display: flex; justify-content: space-between; align-items: center; background: #eef6ff; }
        .history-item-body { display: block; padding: 10px 12px; color: #1c1c1e; font-size: 13px; white-space: pre-wrap; background: #ffffff; line-height: 1.5; border-top: 1px solid #e5e5ea; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #fff; padding: 25px 30px; border-radius: 14px; text-align: center; }
        .modal-card .icon { font-size: 40px; color: #34c759; margin-bottom: 10px; }
        .modal-card p { font-size: 16px; font-weight: bold; color: #1c1c1e; }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .stat-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1> BÁO CÁO F4 AUTO - TAM TRINH</h1>

    <div class="date-picker-box">
        <label>Chọn Ngày Báo Cáo:</label>
        <input type="date" id="selectedDate" onchange="updateAllRenders()">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab8h', event)">1. Đầu giờ (8H)</button>
        <button class="tab-btn" onclick="switchTab('tab17h', event)">2. Tăng ca (17H)</button>
    </div>

    <!-- FORM 8H -->
    <div id="tab8h" class="form-section active">
        <div class="form-grid">
            <div class="form-group">
                <label>Cơ sở:</label>
                <input type="text" id="coSo_8h" value="Tam Trinh" readonly>
            </div>
            <div class="form-group">
                <label>Thời gian:</label>
                <input type="text" id="thoiGian_8h" value="08:00" oninput="render8h()">
            </div>
            <div class="form-group">
                <label>Số lượng Quản lý:</label>
                <input type="text" id="quanLy_8h" value="01" readonly>
            </div>
            <div class="form-group">
                <label>Số lượng Sale Off:</label>
                <input type="number" id="saleOff_8h" value="0" min="0" oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Số Kế toán văn phòng:</label>
                <input type="text" id="keToan_8h" value="01" readonly>
            </div>

            <div class="form-group full-width">
                <label>Trạng thái Kỹ thuật viên hôm nay:</label>
                <div style="border: 1px solid #d1d1d6; border-radius: 6px; overflow: hidden;">
                    <div class="ktv-row"><span class="ktv-name">Vũ</span><select id="status_Vũ" class="ktv-select-status" onchange="render8h()"><option value="Đi Làm" selected>Đi Làm</option><option value="Nghỉ">Nghỉ</option><option value="Nghỉ Sáng">Nghỉ Sáng</option><option value="Nghỉ Chiều">Nghỉ Chiều</option></select></div>
                    <div class="ktv-row"><span class="ktv-name">Hậu</span><select id="status_Hậu" class="ktv-select-status" onchange="render8h()"><option value="Đi Làm" selected>Đi Làm</option><option value="Nghỉ">Nghỉ</option><option value="Nghỉ Sáng">Nghỉ Sáng</option><option value="Nghỉ Chiều">Nghỉ Chiều</option></select></div>
                    <div class="ktv-row"><span class="ktv-name">Hoàng</span><select id="status_Hoàng" class="ktv-select-status" onchange="render8h()"><option value="Đi Làm" selected>Đi Làm</option><option value="Nghỉ">Nghỉ</option><option value="Nghỉ Sáng">Nghỉ Sáng</option><option value="Nghỉ Chiều">Nghỉ Chiều</option></select></div>
                    <div class="ktv-row"><span class="ktv-name">Tùng</span><select id="status_Tùng" class="ktv-select-status" onchange="render8h()"><option value="Đi Làm" selected>Đi Làm</option><option value="Nghỉ">Nghỉ</option><option value="Nghỉ Sáng">Nghỉ Sáng</option><option value="Nghỉ Chiều">Nghỉ Chiều</option></select></div>
                    <div class="ktv-row"><span class="ktv-name">Thịnh</span><select id="status_Thịnh" class="ktv-select-status" onchange="render8h()"><option value="Đi Làm" selected>Đi Làm</option><option value="Nghỉ">Nghỉ</option><option value="Nghỉ Sáng">Nghỉ Sáng</option><option value="Nghỉ Chiều">Nghỉ Chiều</option></select></div>
                </div>
            </div>

            <div class="form-group">
                <label>Dự kiến nghỉ ngày mai:</label>
                <input type="text" id="nghiMai_8h" value="Chưa có." oninput="render8h()">
            </div>
            <div class="form-group">
                <label>Đi muộn:</label>
                <input type="text" id="diMuon_8h" value="Không có." oninput="render8h()">
            </div>
            <div class="form-group full-width">
                <label>Ghi chú bổ sung cho mục Chi tiết (nếu có):</label>
                <input type="text" id="chiTiet_8h" value="" placeholder="Nhập thêm ghi chú khác nếu cần..." oninput="render8h()">
            </div>
        </div>
    </div>

    <!-- FORM 17H -->
    <div id="tab17h" class="form-section">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Cơ sở (Cố định):</label>
                <input type="text" id="coSo_17h" value="Tam Trinh" readonly>
            </div>
            <div class="form-group full-width">
                <label>Chọn Kỹ thuật viên tăng ca:</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Vũ" onchange="render17h()"> Vũ</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Hậu" onchange="render17h()"> Hậu</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Hoàng" onchange="render17h()"> Hoàng</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Tùng" onchange="render17h()"> Tùng</label>
                    <label class="checkbox-item"><input type="checkbox" class="ktv-17h-checkbox" value="Thịnh" onchange="render17h()"> Thịnh</label>
                </div>
            </div>
            <div class="form-group full-width">
                <label>Nội dung công việc:</label>
                <input type="text" id="congViec_17h" placeholder="Nhập nội dung công việc..." oninput="render17h()">
            </div>
            <div class="form-group full-width">
                <label>Thời gian tăng ca đến:</label>
                <select id="thoiGian_17h" onchange="render17h()">
                    <option value="20:00">20:00</option>
                    <option value="21:00">21:00</option>
                    <option value="22:00" selected>22:00</option>
                </select>
            </div>
        </div>
    </div>

    <!-- KHUNG XUẤT KẾT QUẢ -->
    <div class="output-box">
        <div class="output-header">Nội dung báo cáo copy:</div>
        <div id="reportOutput" class="output-content"></div>
        
        <div class="button-group">
            <button class="btn btn-copy" onclick="copyReport()">Sao Chép Báo Cáo</button>
            <button class="btn btn-sync" id="btnSync" onclick="sendToGoogleSheet()">Gửi Lên Google Sheet</button>
        </div>
    </div>

    <!-- BẢNG THỐNG KÊ THEO THÁNG MÀU XANH TÍM -->
    <div class="stat-card">
        <div class="stat-header">
            <div class="stat-title">📊 Thống Kê Theo Tháng</div>
            <div>
                <span style="font-size: 11px; opacity:0.8; margin-right: 5px;">CHỌN THÁNG:</span>
                <input type="month" id="statMonthPicker" class="stat-month-select" onchange="fetchHistoryFromSheet()">
            </div>
        </div>

        <div class="stat-section-title">👨‍🔧 TỔNG SỐ NGÀY ĐI LÀM TRONG THÁNG </div>
        <div class="stat-grid" id="gridWorkingDays"></div>

        <div class="stat-section-title" style="margin-top: 15px;">⏰ TỔNG SỐ GIỜ TĂNG CA TRONG THÁNG </div>
        <div class="stat-grid" id="gridOvertimeHours"></div>
    </div>

    <!-- LỊCH SỬ BÁO CÁO -->
    <div class="history-box">
        <div class="history-title">
            <span>📋 Lịch Sử Báo Cáo</span>
            <button onclick="deleteSelectedHistory()" style="border:1px solid #ff3b30; background:#fff; color:#ff3b30; font-size:12px; font-weight:bold; padding:5px 10px; border-radius:6px; cursor:pointer;">Xóa mục đã chọn</button>
        </div>
        
        <div class="history-tabs">
            <button class="sub-tab-btn active" onclick="switchHistoryTab('8h', event)">Lịch sử 8H</button>
            <button class="sub-tab-btn" onclick="switchHistoryTab('17h', event)">Lịch sử 17H</button>
        </div>

        <div id="historyList" class="history-list"></div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
        <div class="icon">✓</div>
        <p id="modalMsg">Đã tải lên thành công</p>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZ_Zo53JqmoNCcnOdggkkEvmR1JX947SbURolMkpNWY8MtZIWsT4ukO_qV8ZX7wDI11w/exec";
    const ALL_KTV = ["Vũ", "Hậu", "Hoàng", "Tùng", "Thịnh"];
    let currentTab = 'tab8h';
    let currentHistoryTab = '8h';

    window.onload = function() {
        setDefaultDate();
        render8h();
        fetchHistoryFromSheet();
    };

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('selectedDate').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('statMonthPicker').value = `${yyyy}-${mm}`;
    }

    function resetFormToDefault() {
        setDefaultDate();
        document.getElementById('chiTiet_8h').value = "";
        document.getElementById('diMuon_8h').value = "Không có.";
        document.getElementById('nghiMai_8h').value = "Chưa có.";
        ALL_KTV.forEach(ten => {
            document.getElementById(`status_${ten}`).value = "Đi Làm";
        });

        document.querySelectorAll('.ktv-17h-checkbox').forEach(cb => cb.checked = false);
        document.getElementById('congViec_17h').value = "";

        updateAllRenders();
    }

    function getSelectedDateFormatted() {
        const val = document.getElementById('selectedDate').value;
        if (!val) return "";
        const parts = val.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function fmt(val) {
        let num = parseInt(val, 10);
        if (isNaN(num)) return '00';
        return num < 10 && num >= 0 ? '0' + num : '' + num;
    }

    function updateAllRenders() {
        if (currentTab === 'tab8h') render8h();
        if (currentTab === 'tab17h') render17h();
    }

    function switchTab(tabId, evt) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

        if(evt) evt.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'tab8h') { render8h(); switchHistoryTab('8h'); }
        if (tabId === 'tab17h') { render17h(); switchHistoryTab('17h'); }
    }

    function render8h() {
        const coSo = "Tam Trinh";
        const ngay = getSelectedDateFormatted();
        const thoiGian = document.getElementById('thoiGian_8h').value.trim();
        const quanLy = 1;
        const keToan = 1;
        const saleOff = parseInt(document.getElementById('saleOff_8h').value, 10) || 0;
        const ktvCoSo = ALL_KTV.length;
        const tongNhanLuc = quanLy + saleOff + ktvCoSo + keToan;

        let dsNghiText = [];
        let countKtvDiLam = 0;

        ALL_KTV.forEach(ten => {
            const status = document.getElementById(`status_${ten}`).value;
            if (status === "Đi Làm") {
                countKtvDiLam++;
            } else if (status === "Nghỉ") {
                dsNghiText.push(`${ten} nghỉ.`);
            } else if (status === "Nghỉ Sáng") {
                countKtvDiLam++;
                dsNghiText.push(`${ten} nghỉ buổi sáng.`);
            } else if (status === "Nghỉ Chiều") {
                countKtvDiLam++;
                dsNghiText.push(`${ten} nghỉ buổi chiều.`);
            }
        });

        const nhanSuDiLam = quanLy + saleOff + keToan + countKtvDiLam;
        const nghiMai = document.getElementById('nghiMai_8h').value.trim();
        const ghiChuBoSung = document.getElementById('chiTiet_8h').value.trim();
        const diMuon = document.getElementById('diMuon_8h').value.trim();

        let chiTietFull = [...dsNghiText];
        if (ghiChuBoSung !== "") chiTietFull.push(ghiChuBoSung);
        
        let chiTietFormatted = "   •  Khái quát ổn định.";
        if (chiTietFull.length > 0) {
            chiTietFormatted = chiTietFull.map(item => `   •  ${item}`).join('\n');
        }

        const text = `BÁO CÁO TỶ LỆ ĐI LÀM KỸ THUẬT – F4 AUTO
Cơ sở: ${coSo}
Ngày: ${ngay}
Thời gian: ${thoiGian}
1. Tổng nhân lực: ${fmt(tongNhanLuc)}
   •  Quản lý: 01
   •  Sale Off: ${fmt(saleOff)}
   •  Kỹ thuật viên cơ sở: ${fmt(ktvCoSo)}
   •  Kế toán văn phòng: 01
2. Nhân sự đi làm: ${fmt(nhanSuDiLam)}
3. Dự kiến nghỉ ngày mai:
   •  ${nghiMai}
4. Chi tiết:
${chiTietFormatted}
5. Đi muộn:
   •  ${diMuon}

Em xin cảm ơn ạ!`;

        document.getElementById('reportOutput').innerText = text;
    }

    function getHoursValue(endTimeVal) {
        if (endTimeVal === "20:00") return 1;
        if (endTimeVal === "21:00") return 2;
        if (endTimeVal === "22:00") return 3;
        return 0;
    }

    function render17h() {
        const coSo = "Tam Trinh";
        const checkedBoxes = document.querySelectorAll('.ktv-17h-checkbox:checked');
        const selectedKTV = Array.from(checkedBoxes).map(cb => cb.value).join(', ');
        const congViec = document.getElementById('congViec_17h').value.trim();
        const endTime = document.getElementById('thoiGian_17h').value;

        const text = `ĐĂNG KÝ TĂNG CA

– Cơ sở: ${coSo}
– Kỹ thuật viên: ${selectedKTV || 'Chưa chọn'}
– Nội dung công việc: ${congViec}
– Thời gian tăng ca: ${endTime}

Em gửi ạ.`;

        document.getElementById('reportOutput').innerText = text;
    }

    function copyReport() {
        const text = document.getElementById('reportOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            showSuccessPopup("Đã sao chép nội dung báo cáo!");
        });
    }

    function sendToGoogleSheet() {
        const btnSync = document.getElementById('btnSync');
        btnSync.disabled = true;
        btnSync.innerText = "Đang gửi...";

        const params = new URLSearchParams();
        const reportText = document.getElementById('reportOutput').innerText;
        const reportDate = getSelectedDateFormatted();

        if (currentTab === 'tab8h') {
            let statusMap = {};
            ALL_KTV.forEach(ten => {
                statusMap[ten] = document.getElementById(`status_${ten}`).value;
            });

            params.append('action', 'addReport');
            params.append('type', '8h');
            params.append('date', reportDate);
            params.append('statusMap', JSON.stringify(statusMap));
            params.append('content', reportText);

        } else if (currentTab === 'tab17h') {
            const checkedBoxes = document.querySelectorAll('.ktv-17h-checkbox:checked');
            const selectedKTVs = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedKTVs.length === 0) {
                alert("Vui lòng chọn ít nhất 1 Kỹ thuật viên tăng ca!");
                btnSync.disabled = false;
                btnSync.innerText = "Gửi Lên Google Sheet";
                return;
            }

            const endTime = document.getElementById('thoiGian_17h').value;

            params.append('action', 'addReport');
            params.append('type', '17h');
            params.append('date', reportDate);
            params.append('selectedKTVs', selectedKTVs.join(', '));
            params.append('hours', getHoursValue(endTime));
            params.append('thoiGian', endTime);
            params.append('content', reportText);
        }

        fetch(WEB_APP_URL, {
            method: "POST",
            body: params
        })
        .then(res => res.json())
        .then(data => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            showSuccessPopup("Đã lưu & đồng bộ thành công!");
            fetchHistoryFromSheet();
            resetFormToDefault();
        })
        .catch(err => {
            btnSync.disabled = false;
            btnSync.innerText = "Gửi Lên Google Sheet";
            alert("Lỗi kết nối: " + err);
        });
    }

    function showSuccessPopup(msg) {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalMsg').innerText = msg;
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.style.display = 'none'; }, 2500);
    }

    // Đọc lịch sử trực tiếp từ Google Sheet & cập nhật lại Thống kê tháng
    function fetchHistoryFromSheet() {
        const monthVal = document.getElementById('statMonthPicker').value; // Format: YYYY-MM
        if (!monthVal) return;

        const parts = monthVal.split('-');
        const monthYearStr = `${parts[1]}/${parts[0]}`; // Chuyển thành MM/YYYY

        fetch(`${WEB_APP_URL}?action=getHistory&month=${monthYearStr}`)
        .then(res => res.json())
        .then(data => {
            if (data && data.status === "success") {
                localStorage.setItem('f4_history_8h', JSON.stringify(data.history8h || []));
                localStorage.setItem('f4_history_17h', JSON.stringify(data.history17h || []));
                
                loadHistory();
                calculateMonthlyStats();
            }
        })
        .catch(err => {
            loadHistory();
            calculateMonthlyStats();
        });
    }

    function switchHistoryTab(type, evt) {
        currentHistoryTab = type;
        document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));

        if(evt) {
            evt.target.classList.add('active');
        } else {
            const btns = document.querySelectorAll('.sub-tab-btn');
            if(type === '8h') btns[0].classList.add('active');
            if(type === '17h') btns[1].classList.add('active');
        }

        loadHistory();
    }

    function loadHistory() {
    const storageKey = `f4_history_${currentHistoryTab}`;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const historyListEl = document.getElementById('historyList');

    if (history.length === 0) {
        historyListEl.innerHTML = '<div style="text-align:center; padding: 20px; color:#8e8e93; font-size:13px;">Chưa có lịch sử báo cáo.</div>';
        return;
    }

    let html = '';
    history.forEach((item) => {
        // Đảm bảo lọc lấy đúng ngày DD/MM/YYYY
        let displayDate = item.time ? item.time.split(' ')[0] : getSelectedDateFormatted();

        html += `
        <div class="history-item">
            <div class="history-item-header">
                <div>
                    <input type="checkbox" class="history-select-cb" data-id="${item.id}" style="margin-right: 6px;">
                    <span style="font-weight: bold; color: #1c1c1e;">${displayDate}</span>
                </div>
                <span style="color:#34c759; font-weight: bold;">✓ Đã gửi Sheet</span>
            </div>
            <div class="history-item-body">${item.content}</div>
        </div>`;
    });

    historyListEl.innerHTML = html;
}

    function deleteSelectedHistory() {
        const storageKey = `f4_history_${currentHistoryTab}`;
        let history = JSON.parse(localStorage.getItem(storageKey) || '[]');
        const checkedCbs = document.querySelectorAll('.history-select-cb:checked');

        if (checkedCbs.length === 0) {
            alert("Vui lòng chọn ít nhất một mục để xóa!");
            return;
        }

        if (confirm("Xóa mục này trên giao diện sẽ đồng bộ làm sạch lại dữ liệu?")) {
            const selectedIds = Array.from(checkedCbs).map(cb => parseInt(cb.getAttribute('data-id'), 10));
            history = history.filter(item => !selectedIds.includes(item.id));
            localStorage.setItem(storageKey, JSON.stringify(history));
            loadHistory();
        }
    }

    // Tính toán lại Tổng số ngày làm và Tổng giờ tăng ca dựa trên Dữ liệu Sheet đồng bộ về
    function calculateMonthlyStats() {
        let workingDaysMap = {};
        let overtimeHoursMap = {};

        ALL_KTV.forEach(k => {
            workingDaysMap[k] = 0;
            overtimeHoursMap[k] = 0;
        });

        // 1. Cộng tổng ngày công từ Lịch sử Chấm công (8H)
        const history8h = JSON.parse(localStorage.getItem('f4_history_8h') || '[]');
        history8h.forEach(item => {
            if (item.extraData) {
                ALL_KTV.forEach(k => {
                    const st = item.extraData[k];
                    if (st === "Đi Làm") workingDaysMap[k] += 1;
                    else if (st === "Nghỉ Sáng" || st === "Nghỉ Chiều") workingDaysMap[k] += 0.5;
                });
            }
        });

        // 2. Cộng tổng giờ tăng ca từ Lịch sử Tăng ca (17H)
        const history17h = JSON.parse(localStorage.getItem('f4_history_17h') || '[]');
        history17h.forEach(item => {
            if (item.extraData) {
                ALL_KTV.forEach(k => {
                    const hrs = parseFloat(item.extraData[k]) || 0;
                    overtimeHoursMap[k] += hrs;
                });
            }
        });

        // 3. Đưa thông số đã đồng bộ lên Giao diện Thống kê
        let daysHtml = '';
        let hoursHtml = '';

        ALL_KTV.forEach(k => {
            daysHtml += `
            <div class="stat-item-box">
                <div class="ktv-label">${k}</div>
                <div class="ktv-val">${workingDaysMap[k]} ngày</div>
            </div>`;

            hoursHtml += `
            <div class="stat-item-box">
                <div class="ktv-label">${k}</div>
                <div class="ktv-val">${overtimeHoursMap[k]}h</div>
            </div>`;
        });

        document.getElementById('gridWorkingDays').innerHTML = daysHtml;
        document.getElementById('gridOvertimeHours').innerHTML = hoursHtml;
    }
</script>
